name: Build portable

on:
  push:
    # "master" kept alongside "main" so a branch rename doesn't silently stop builds
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Don't let a burst of pushes pile up runners; keep only the newest per ref.
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    # Must be Windows: this packages a Windows Electron app and a win32-x64
    # native PTY binary, and the icon is generated by a PowerShell script.
    runs-on: windows-latest

    # Write access is only needed by the tag-triggered release step below.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron is ~270 MB per build; without this every run re-downloads it.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building version $v"

      - name: Build portable exe
        # No signing certificate in CI; without this electron-builder goes looking
        # for one and the log fills with noise.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:portable

      - name: Verify the exe was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'Terman-*-Portable.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'No portable exe in dist/ - build produced nothing' }
          if ($exe.Length -lt 50MB) { throw "Suspiciously small: $($exe.Length) bytes" }
          "{0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB)

      # Downloadable from the run's summary page. upload-artifact always zips,
      # so this lands as a .zip containing the exe.
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Terman-${{ steps.meta.outputs.version }}-Portable
          path: dist/Terman-*-Portable.exe
          if-no-files-found: error
          retention-days: 90

      # Tag pushes additionally get a Release, which is the only way to hand out a
      # stable public link that doesn't require being signed in to GitHub.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Terman-*-Portable.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
