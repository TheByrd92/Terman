name: Build & release

on:
  push:
    # "master" kept alongside "main" so a branch rename doesn't silently stop builds
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this run'
        type: choice
        default: patch
        options: [patch, minor, major, none]

# Don't let a burst of pushes pile up runners. Only PR builds are cancellable --
# cancelling a main build could kill it between "push the tag" and "publish the
# release", leaving a tag with no download attached.
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    # Must be Windows: this packages a Windows Electron app and a win32-x64
    # native PTY binary, and the icon is generated by a PowerShell script.
    runs-on: windows-latest

    # Needed to push the version bump, its tag, and the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron is ~270 MB per build; without this every run re-downloads it.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Patch unless told otherwise. A tag push is already a version so it never
      # bumps, and neither does a PR -- there's nowhere to push the commit.
      - name: Decide bump level
        id: bump
        shell: pwsh
        run: |
          $level = 'patch'
          if ('${{ github.event_name }}' -eq 'pull_request' -or '${{ github.ref }}'.StartsWith('refs/tags/')) {
            $level = 'none'
          } elseif ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $level = '${{ inputs.bump }}'
          } else {
            $msg = git log -1 --pretty=%B
            # [skip ci] first: that's this workflow's own release commit. GITHUB_TOKEN
            # pushes don't trigger workflows so it shouldn't be seen at all, but with a
            # PAT they would -- and bumping our own bump is an infinite loop.
            if ($msg -match '\[skip ci\]') { $level = 'none' }
            elseif ($msg -match '\[(major|breaking)\]') { $level = 'major' }
            elseif ($msg -match '\[minor\]') { $level = 'minor' }
            elseif ($msg -match '\[(skip|no)[ -]bump\]') { $level = 'none' }
          }
          "level=$level" >> $env:GITHUB_OUTPUT
          "Bump: $level"

      # Bump the file but DON'T commit or tag yet -- that waits until the build
      # passes, so a broken commit never gets a version tag. Building from the
      # bumped package.json is what keeps the exe name and the tag in step.
      - name: Apply version bump
        if: steps.bump.outputs.level != 'none'
        run: npm version ${{ steps.bump.outputs.level }} --no-git-tag-version

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building version $v"

      # All three win targets from package.json: installer, portable, plain zip.
      - name: Build all Windows targets
        # No signing certificate in CI; without this electron-builder goes looking
        # for one and the log fills with noise. The dist script also passes
        # --publish never: on CI electron-builder otherwise tries to create the
        # GitHub release itself and dies wanting GH_TOKEN. The "Publish release"
        # step below owns that, so electron-builder only ever packages here.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      # Every artifact must exist and be plausibly sized. A missing installer used to
      # be invisible here because only the portable exe was ever checked.
      - name: Verify the artifacts were produced
        shell: pwsh
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          # Exact names, not Terman-*: a wildcard happily matches a stale artifact from
          # a different version and reports success for a file this run never built.
          $expected = @(
            "Terman-$v-Setup.exe",
            "Terman-$v-Portable.exe",
            "Terman-$v-win-x64.zip"
          )
          $problems = @()
          foreach ($name in $expected) {
            $f = Get-Item (Join-Path 'dist' $name) -ErrorAction SilentlyContinue
            if (-not $f) { $problems += "$name - not produced"; continue }
            if ($f.Length -lt 50MB) {
              $problems += "$name - suspiciously small ($($f.Length) bytes)"
              continue
            }
            "OK  {0} ({1:N1} MB)" -f $f.Name, ($f.Length / 1MB)
          }
          if ($problems) { throw "Build output is wrong:`n" + ($problems -join "`n") }

      # Downloadable from the run's summary page. upload-artifact always zips,
      # so this lands as a .zip containing all three files.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Terman-${{ steps.meta.outputs.version }}-Windows
          path: |
            dist/Terman-${{ steps.meta.outputs.version }}-Setup.exe
            dist/Terman-${{ steps.meta.outputs.version }}-Portable.exe
            dist/Terman-${{ steps.meta.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      # Only now that the build is known good. A push authenticated with
      # GITHUB_TOKEN does not trigger workflows, so this can't loop -- which is also
      # why the release below runs here instead of on the tag push.
      - name: Commit and tag the bump
        if: steps.bump.outputs.level != 'none'
        shell: pwsh
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v$v [skip ci]"
          git tag "v$v"
          # Fails loudly on a non-fast-forward -- somebody pushed to the branch while
          # this was building, and quietly rebasing a release commit is worse.
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$v"

      # The only way to hand out a download link that works without a GitHub account.
      - name: Publish release
        if: steps.bump.outputs.level != 'none' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          # Named exactly, one per line: with fail_on_unmatched_files a target that
          # silently stops building fails the release instead of shipping short.
          files: |
            dist/Terman-${{ steps.meta.outputs.version }}-Setup.exe
            dist/Terman-${{ steps.meta.outputs.version }}-Portable.exe
            dist/Terman-${{ steps.meta.outputs.version }}-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
